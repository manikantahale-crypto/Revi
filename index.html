      top: 47.73%;
      width: 66.31%;
      height: 15.43%;
      background-color: #FAF6EF;
      color: #101D35;

      border-radius: clamp(14px, 3.5vw, 20px);
      border: 1.5px solid transparent;
      outline: none;
      resize: none;
      z-index: 15;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .review-textarea:focus {
      background-color: #FFFFFF;
      border-color: #C99543;
      box-shadow: 0 0 0 2.5px rgba(201, 149, 67, 0.2);
    }

    /* =========================================================================
       FUNCTIONAL CIRCULAR REFRESH / ROTATE BUTTON
       Position: top 48.05%, left 73.55%, width 8.2%
       ========================================================================= */
    .rotate-draft-btn {
      position: absolute;
      left: 73.55%;
      top: 48.05%;
      width: 8.2%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #FFFDF9;
      border: 1.5px solid #E4CCAA;
      color: #C99543;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: 0 2px 6px rgba(180, 140, 80, 0.18);
      z-index: 20;
      transition: transform 0.22s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
    }

    .rotate-draft-btn:hover {
      background: #FBF6EE;
      transform: scale(1.08);
      box-shadow: 0 3px 8px rgba(180, 140, 80, 0.28);
    }

    .rotate-draft-btn:active {
      transform: scale(0.92);
    }

    .rotate-icon-svg {
      width: 58%;
      height: 58%;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .rotate-draft-btn.spinning .rotate-icon-svg {
      transform: rotate(360deg);
    }

    /* =========================================================================
       FUNCTIONAL "COPY & POST REVIEW" BUTTON OVERLAY
       Position: top 65.79%, left 17.22%, width 65.46%, height 7.48%
       ========================================================================= */
    .copy-post-btn {
      position: absolute;

      top: 65.79%;
      width: 65.46%;
      height: 7.48%;

    }

    .copy-post-btn:hover {
      background: rgba(255, 255, 255, 0.08);

      align-items: center;

    // Destination Google Review Link
    const GOOGLE_REVIEW_URL = "https://g.page/r/CZZqSaS0PsMOEBE/review";

    // DOM Elements
    const reviewTextarea = document.getElementById("reviewText");
    const rotateDraftBtn = document.getElementById("rotateDraftBtn");
    const copyPostBtn = document.getElementById("copyPostBtn");

    // =========================================================================
    // 2. TEXT FORMATTING LOGIC
    // - Preserves original capitalization, spelling, contractions, and punctuation.
    // - If a review has been supplied without ending punctuation, does NOT automatically add a full stop.
    // - Trims extraneous whitespace while preserving the customer's exact formatting.
    // =========================================================================
    function formatReviewDraft(draft) {
      if (typeof draft !== "string") return "";
      // Clean unnecessary leading/trailing whitespace only, preserving original punctuation & casing
      return draft.trim();
    }

    // =========================================================================
    // 3. NON-REPEATING SHUFFLE DECK ALGORITHM
    // =========================================================================
    let deck = [];
    let deckIndex = -1;
    let lastDraft = REVIEW_DRAFTS[0];

    function createShuffledDeck() {
      const indices = REVIEW_DRAFTS.map((_, i) => i);
      // Fisher-Yates shuffle
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      // Guarantee the first item of a new cycle is not identical to the last shown draft
      if (indices.length > 1 && REVIEW_DRAFTS[indices[0]] === lastDraft) {
        [indices[0], indices[1]] = [indices[1], indices[0]];
      }
      return indices;
    }

    function getNextDraft() {
      if (deck.length === 0 || deckIndex >= deck.length - 1) {
        deck = createShuffledDeck();
        deckIndex = 0;
      } else {
        deckIndex++;
      }
      const rawDraft = REVIEW_DRAFTS[deck[deckIndex]];
      const formattedDraft = formatReviewDraft(rawDraft);
      lastDraft = rawDraft;
      return formattedDraft;
    }

    // Initialize deck
    deck = createShuffledDeck();

    // Rotate Button Click Listener
    rotateDraftBtn.addEventListener("click", () => {
      rotateDraftBtn.classList.add("spinning");
      setTimeout(() => {
        rotateDraftBtn.classList.remove("spinning");
      }, 350);

      const nextDraft = getNextDraft();
      reviewTextarea.value = nextDraft;
      reviewTextarea.focus();
    });

    // =========================================================================
    // 3. RELIABLE CLIPBOARD COPY & NAVIGATION (PRESERVING USER GESTURE)
    // =========================================================================
    function copyToClipboard(text) {
      let copied = false;

      // 1. Synchronous execCommand copy preserves the immediate user gesture
      try {
        const tempEl = document.createElement("textarea");
        tempEl.value = text;
        tempEl.setAttribute("readonly", "");
        tempEl.style.position = "fixed";
        tempEl.style.left = "-9999px";
        tempEl.style.top = "0";
        document.body.appendChild(tempEl);
        tempEl.focus();
        tempEl.select();
        tempEl.setSelectionRange(0, 99999);
        copied = document.execCommand("copy");
        document.body.removeChild(tempEl);
      } catch (err) {
        console.warn("execCommand fallback copy error:", err);
      }

      // 2. Dispatch modern Clipboard API without blocking
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch((err) => {
          console.warn("navigator.clipboard.writeText error:", err);
        });
      }

      return copied;
    }

    copyPostBtn.addEventListener("click", () => {
      const currentText = reviewTextarea.value.trim();

      // Copy exact current contents
      copyToClipboard(currentText);

      // Instant button feedback
      copyPostBtn.classList.add("copied");

      // Synchronously open Google Review URL to preserve user gesture
      let openedWindow = null;
      try {
        openedWindow = window.open(GOOGLE_REVIEW_URL, "_blank", "noopener,noreferrer");
      } catch (e) {
        openedWindow = null;
      }

      // Fallback: If new tab was blocked or unavailable, redirect directly
      if (!openedWindow || openedWindow.closed || typeof openedWindow.closed === "undefined") {
        window.location.href = GOOGLE_REVIEW_URL;
      }
    });
